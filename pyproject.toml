[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meadery"
version = "0.1"
description = "Tools for mead and wine calculations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12,<1.0",
  "numpy>=1.21",
  "scipy>=1.7",
  "trogon>=0.6.0"
]

[project.scripts]
meadery = "meadery.main:app"

[tool.setuptools.packages.find]
include = ["meadery*"]
exclude = ["recipes*"]

[tool.setuptools.package-data]
meadery = ["data/*.json"]

# recipes/*.recipe files are included as data files via MANIFEST.in
